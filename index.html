<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goblin Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #5eead4;
    --user-bubble: #1f6f5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0f1115; border: none; font-weight: 600; }
  button.primary:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.55; font-size: 15px; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; width: 100%; max-width: 100%; }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant pre {
    position: relative;
    background: #0b0d11;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 10px 0;
  }
  .msg.assistant code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13.5px; }
  .msg.assistant :not(pre) > code { background: #0b0d11; padding: 2px 6px; border-radius: 4px; }
  .msg.assistant ul, .msg.assistant ol { margin: 8px 0 8px 22px; }
  .msg.assistant li { margin-bottom: 4px; }
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 12px;
    padding: 4px 10px;
    opacity: 0.6;
  }
  .copy-btn:hover { opacity: 1; }
  .empty-state { text-align: center; color: var(--muted); margin-top: 15vh; }
  .empty-state h2 { font-size: 26px; margin-bottom: 8px; color: var(--text); }
  #composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 16px;
  }
  #composer-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    resize: none;
    max-height: 160px;
    font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  /* settings modal */
  #settings-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #settings-modal.open { display: flex; }
  .modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 420px;
    max-width: 92vw;
  }
  .modal-card h2 { margin-bottom: 16px; font-size: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>👺 <span>Goblin</span> Chat</h1>
  <div class="header-actions">
    <button id="new-chat-btn" title="Start a new chat">+ New</button>
    <button id="settings-btn" title="Settings">⚙️</button>
  </div>
</header>

<main id="messages">
  <div class="empty-state" id="empty-state">
    <h2>What do you want to chat about?</h2>
    <p>Hit ⚙️ to point this at Ollama, OpenAI, OpenRouter — anything OpenAI-compatible.</p>
  </div>
</main>

<div id="composer">
  <div id="composer-inner">
    <textarea id="input" rows="1" placeholder="Message Goblin Chat… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send-btn" class="primary">Send</button>
    <button id="stop-btn" style="display:none">Stop</button>
  </div>
  <div class="hint">Your API key stays in this browser's local storage — it never leaves your machine except to the API you configure.</div>
</div>

<div id="settings-modal">
  <div class="modal-card">
    <h2>Settings</h2>
    <div class="field">
      <label>API Base URL (OpenAI-compatible)</label>
      <input id="set-base-url" placeholder="http://localhost:11434/v1">
    </div>
    <div class="field">
      <label>API Key (leave blank for local Ollama)</label>
      <input id="set-api-key" type="password" placeholder="sk-…">
    </div>
    <div class="field">
      <label>Model</label>
      <input id="set-model" placeholder="llama3.1">
    </div>
    <div class="field">
      <label>System prompt</label>
      <textarea id="set-system" rows="3" placeholder="You are a helpful assistant."></textarea>
    </div>
    <div class="modal-actions">
      <button id="settings-cancel">Cancel</button>
      <button id="settings-save" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $('messages'), inputEl = $('input');

const DEFAULTS = {
  baseUrl: 'http://localhost:11434/v1',
  apiKey: '',
  model: 'llama3.1',
  system: 'You are a helpful assistant.'
};

function loadSettings() {
  try {
    return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('goblin-chat-settings') || '{}') };
  } catch { return { ...DEFAULTS }; }
}
function saveSettings(s) {
  localStorage.setItem('goblin-chat-settings', JSON.stringify(s));
}
let settings = loadSettings();
let aborter = null;
let history = []; // {role, content} excluding system

function renderMarkdown(text) {
  const html = marked.parse(text || '');
  return DOMPurify.sanitize(html);
}

function addCopyButtons(scope) {
  scope.querySelectorAll('pre').forEach((pre) => {
    if (pre.querySelector('.copy-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      navigator.clipboard.writeText(pre.innerText).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      });
    };
    pre.appendChild(btn);
  });
}

function addMessage(role, content) {
  $('empty-state')?.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'assistant') {
    div.innerHTML = renderMarkdown(content);
    addCopyButtons(div);
  } else {
    div.textContent = content;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function setBusy(busy) {
  $('send-btn').style.display = busy ? 'none' : '';
  $('stop-btn').style.display = busy ? '' : 'none';
  inputEl.disabled = busy;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || aborter) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  const assistantDiv = addMessage('assistant', '');
  assistantDiv.innerHTML = '<span class="typing">thinking…</span>';

  aborter = new AbortController();
  setBusy(true);

  const baseUrl = settings.baseUrl.replace(/\/+$/, '');
  let fullText = '';
  let firstToken = true;

  try {
    const res = await fetch(baseUrl + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(settings.apiKey ? { 'Authorization': 'Bearer ' + settings.apiKey } : {})
      },
      body: JSON.stringify({
        model: settings.model,
        stream: true,
        messages: [
          ...(settings.system ? [{ role: 'system', content: settings.system }] : []),
          ...history
        ]
      }),
      signal: aborter.signal
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`API error ${res.status}: ${errText.slice(0, 200)}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') break;
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            if (firstToken) { assistantDiv.innerHTML = ''; firstToken = false; }
            fullText += delta;
            assistantDiv.innerHTML = renderMarkdown(fullText);
            addCopyButtons(assistantDiv);
            if (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120) {
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
        } catch { /* partial JSON chunk, ignore */ }
      }
    }

    if (!fullText) assistantDiv.innerHTML = '<span class="typing">(empty response)</span>';
    else history.push({ role: 'assistant', content: fullText });

  } catch (e) {
    if (e.name === 'AbortError') {
      if (fullText) history.push({ role: 'assistant', content: fullText });
      else assistantDiv.innerHTML = '<span class="typing">(stopped)</span>';
    } else {
      assistantDiv.innerHTML = '<span class="typing">⚠️ ' +
        DOMPurify.sanitize(e.message) +
        '<br><br>Check the API base URL, model name, and API key in ⚙️ settings.</span>';
      history.pop(); // drop the failed user message from history
    }
  } finally {
    aborter = null;
    setBusy(false);
    inputEl.focus();
  }
}

// --- events ---
$('send-btn').onclick = sendMessage;
$('stop-btn').onclick = () => aborter?.abort();
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
$('new-chat-btn').onclick = () => {
  aborter?.abort();
  history = [];
  messagesEl.innerHTML = '<div class="empty-state" id="empty-state"><h2>What do you want to chat about?</h2><p>Hit ⚙️ to point this at Ollama, OpenAI, OpenRouter — anything OpenAI-compatible.</p></div>';
};

// --- settings modal ---
function openSettings() {
  $('set-base-url').value = settings.baseUrl;
  $('set-api-key').value = settings.apiKey;
  $('set-model').value = settings.model;
  $('set-system').value = settings.system;
  $('settings-modal').classList.add('open');
}
$('settings-btn').onclick = openSettings;
$('settings-cancel').onclick = () => $('settings-modal').classList.remove('open');
$('settings-modal').addEventListener('click', (e) => {
  if (e.target.id === 'settings-modal') $('settings-modal').classList.remove('open');
});
$('settings-save').onclick = () => {
  settings = {
    baseUrl: $('set-base-url').value.trim() || DEFAULTS.baseUrl,
    apiKey: $('set-api-key').value.trim(),
    model: $('set-model').value.trim() || DEFAULTS.model,
    system: $('set-system').value.trim()
  };
  saveSettings(settings);
  $('settings-modal').classList.remove('open');
};

inputEl.focus();
</script>
</body>
</html>
